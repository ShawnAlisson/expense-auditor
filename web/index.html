<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Auditor</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#1c1b19;--mute:#76736a;--line:#ebe9e2;--ok:#16794a;--bad:#c0362c;--warn:#b26a00;--pur:#7b3fc4;--rev:#5b6472;--acc:#1f4d3a}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1d1a;--ink:#efede6;--mute:#9a978d;--line:#2e2d29;--ok:#2f9d68;--bad:#d9564b;--warn:#c98a1f;--pur:#9a63d9;--rev:#6b7587;--acc:#6fd4a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;margin:0;color:var(--mute)}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:18px 0 4px}
.big span{color:var(--bad)}
.sub{color:var(--mute);margin:0 0 26px}
.row{display:grid;grid-template-columns:116px 1fr auto;gap:4px 14px;align-items:center;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.row:last-of-type{border-bottom:1px solid var(--line)}
.pill{justify-self:start;color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.05em;padding:4px 10px;border-radius:99px;white-space:nowrap}
.what b{font-weight:600}
.what div{color:var(--mute);font-size:14px}
.amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.amt small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.extra{grid-column:1/-1;display:none;font-size:13px;color:var(--mute);padding:6px 0 2px}
.row.open .extra{display:block}
.extra p{margin:4px 0}.extra b{color:var(--ink)}
.fix{grid-column:2/-1;font-size:13.5px}
.fix button{border-color:var(--acc);color:var(--acc);font-weight:600;background:transparent;padding:4px 10px;font-size:13px}
.flip{color:var(--ink)}.flip s{color:var(--mute)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
.foot{color:var(--mute);font-size:13px;margin-top:22px}
@media(max-width:520px){.row{grid-template-columns:1fr auto}.pill{grid-column:1/-1}.fix{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="meta"></h1><div><span class="foot" id="mode" style="margin-right:8px"></span><button class="primary" id="run">Run live audit</button></div></div>
<div class="big" id="big"></div>
<p class="sub" id="sub"></p>
<div id="rows"></div>
<p class="foot">Each expense is a claim. Banyan Sapling checks it against the policy and the receipts and answers in one pass. When it is not at least 75% sure, a person decides. Tap a row for the details.</p>
</main>
<script>
const L={supported:["APPROVE","var(--ok)"],violation:["REJECT","var(--bad)"],insufficient_information:["REQUEST DOCS","var(--warn)"],inconsistent_context:["ESCALATE","var(--pur)"]};
const NM={supported:"supported",violation:"violation",insufficient_information:"insufficient info",inconsistent_context:"inconsistent"};
const KEYS=["supported","violation","insufficient_information","inconsistent_context"];
const RANK={"REJECT":0,"ESCALATE":1,"REQUEST DOCS":2,"HUMAN REVIEW":3,"APPROVE":4};
let report,cache,live=true;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gbp=n=>"£"+n.toLocaleString("en-GB",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
function tri(r){const l=r.raw_label,p=r.probabilities[l];return p>=.75?{a:L[l][0],c:L[l][1],lean:l,p}:{a:"HUMAN REVIEW",c:"var(--rev)",lean:l,p}}

function rowHTML(l){return `<div class="row" id="r-${l.id}"><span class="pill" style="background:var(--line);color:var(--mute)">…</span>
 <span class="what"><b>${esc(l.short)}</b><div>${esc(l.note)}</div></span><span class="amt">${gbp(l.amount)}<small id="p-${l.id}"></small></span>
 <div class="fix" id="f-${l.id}"></div>
 <div class="extra" id="x-${l.id}"></div></div>`}

function fill(l,res){
  const t=tri(res);l._t=t;l._res=res;const r=$("#r-"+l.id);
  r.querySelector(".pill").outerHTML=`<span class="pill" style="background:${t.c}">${t.a}</span>`;
  $("#p-"+l.id).textContent=t.a==="HUMAN REVIEW"?`${(t.p*100).toFixed(0)}% ${NM[t.lean]}`:`${(t.p*100).toFixed(0)}% sure`;
  $("#x-"+l.id).innerHTML=`<p><b>Policy:</b> ${esc(l.policy)}</p><p><b>Evidence:</b> ${esc(l.evidence)}</p><p><b>Claim:</b> ${esc(l.claim)}</p>
   <p><b>Sapling:</b> ${KEYS.map(k=>`${NM[k]} ${(res.probabilities[k]*100).toFixed(0)}%`).join(" · ")} · calibrated status: ${res.status}</p>`;
  if(l.fix&&!l._fixed)$("#f-"+l.id).innerHTML=`<button data-fix="${l.id}">+ ${esc(l.fix.label)}</button>`;
  head()}

function head(){
  let all=0,stop=0,rev=0;report.lines.forEach(l=>{all+=l.amount;if(l._t){if(["REJECT","ESCALATE","REQUEST DOCS"].includes(l._t.a))stop+=l.amount;if(l._t.a==="HUMAN REVIEW")rev+=l.amount}});
  $("#big").innerHTML=`<span>${gbp(stop)}</span> of ${gbp(all)} stopped before payment`;
  $("#sub").textContent=`${report.employee}'s trip report. ${gbp(rev)} is too close to call and goes to a person.`}

async function check(l,evidence,which){
  if(live){try{const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({policy:l.policy,evidence:evidence??l.evidence,claim:l.claim})});
    if(r.ok){const j=await r.json();if(j.probabilities)return j}else if(![404,405,501].includes(r.status))throw 0}catch(e){}
    live=false;$("#mode").textContent="Showing a recorded run"}
  return which==="fixed"?cache[l.id].fixed.sapling:cache[l.id].sapling}

async function applyFix(l){
  const b=l._t,f=$("#f-"+l.id);f.innerHTML='<span class="spin"></span> Sapling is re-checking…';
  const res=await check(l,l.fix.evidence,"fixed");l._fixed=true;fill(l,res);const a=l._t;$("#r-"+l.id).querySelector(".what div").textContent="Updated: "+l.fix.label.toLowerCase();
  f.innerHTML=`<span class="flip">After “${esc(l.fix.label.toLowerCase())}”: <s>${b.a} ${(b.p*100).toFixed(0)}%</s> → <b style="color:${a.c==="var(--rev)"?"var(--ink)":a.c}">${a.a}${a.a==="HUMAN REVIEW"?` · leans ${NM[a.lean]} ${(a.p*100).toFixed(0)}%`:` ${(a.p*100).toFixed(0)}%`}</b></span>`}

function sortRows(){const rows=[...report.lines].sort((x,y)=>(RANK[x._t?.a]??9)-(RANK[y._t?.a]??9));rows.forEach(l=>$("#rows").appendChild($("#r-"+l.id)))}

async function runAll(){
  $("#run").disabled=true;report.lines.forEach(l=>{l._fixed=false;$("#f-"+l.id).innerHTML="";$("#r-"+l.id).querySelector(".pill").outerHTML='<span class="pill" style="background:var(--line);color:var(--mute)"><span class="spin"></span></span>'});
  await Promise.all(report.lines.map(async l=>fill(l,await check(l))));sortRows();$("#run").disabled=false;if(live)$("#mode").textContent="Live from the Sapling API"}

(async()=>{
  report=await (await fetch("report.json")).json();
  try{cache=await (await fetch("results.json")).json()}catch(e){cache={}}
  $("#meta").textContent=`Expense Auditor · ${report.report_id}`;
  $("#rows").innerHTML=report.lines.map(rowHTML).join("");
  $("#rows").addEventListener("click",e=>{if(e.target.dataset.fix)return applyFix(report.lines.find(x=>x.id===e.target.dataset.fix));if(e.target.closest("button"))return;const r=e.target.closest(".row");if(r)r.classList.toggle("open")});
  $("#run").onclick=runAll;
  report.lines.forEach(l=>cache[l.id]&&fill(l,cache[l.id].sapling));sortRows();
  $("#mode").textContent="Last recorded run";
  if(location.search.includes("demo=fixed")){for(const l of report.lines)if(l.fix)await applyFix(l);sortRows()}
})();
</script>
</body>
</html>
